[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/pets/*.json,assets/pets/*/*.json"
exclude_filter="artifacts/*,tests/*,docs/*,dist/*,runtime/*,agentarium-codex-app/*,scripts/*.ps1,scripts/*.py"
export_path="dist/Agentarium.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://artifacts/templates/windows_debug_x86_64.exe"
custom_template/release="res://artifacts/templates/windows_release_x86_64.exe"
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/console_wrapper=0
